<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>NEON VOID</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04050c}
body{font-family:Consolas,'SF Mono',Menlo,'Courier New',monospace;color:#cfd8ff;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block}
.hidden{display:none!important}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#xpwrap{position:absolute;top:0;left:0;right:0;height:7px;background:rgba(110,140,255,.13)}
#xpbar{height:100%;width:0;background:linear-gradient(90deg,#22e59f,#7df9ff);box-shadow:0 0 10px #2bffb0}
#topline{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;gap:44px;font-size:16px;letter-spacing:2px;color:#cfe8ff;text-shadow:0 0 9px rgba(80,200,255,.8)}
#hpwrap{position:absolute;left:18px;top:38px;width:230px;height:15px;background:rgba(255,70,110,.14);border:1px solid rgba(255,90,120,.55)}

#hpbar{position:relative;height:100%;width:100%;background:linear-gradient(90deg,#ff4d6d,#ff96a8);box-shadow:0 0 10px #ff4d6d;transition:width .12s}

.wep{display:flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid rgba(130,220,255,.4);background:rgba(10,18,38,.7);font-size:11px;letter-spacing:1px}

#dashbar{height:5px;background:rgba(120,160,255,.15);border:1px solid rgba(130,170,255,.4);margin-top:3px}
#dashfill{height:100%;width:100%;background:#7df9ff;box-shadow:0 0 8px #7df9ff}
#bossbar{position:absolute;top:48px;left:50%;transform:translateX(-50%);width:min(540px,72vw);text-align:center}
#bossname{font-size:13px;letter-spacing:4px;color:#ff9db1;text-shadow:0 0 10px #ff3b5c;margin-bottom:4px}
#bosshpwrap{height:9px;background:rgba(255,60,90,.15);border:1px solid rgba(255,70,100,.6)}
#bosshp{height:100%;width:100%;background:linear-gradient(90deg,#ff3b5c,#ff8a5c);box-shadow:0 0 10px #ff3b5c}
#hint{position:absolute;right:16px;bottom:16px;font-size:10px;letter-spacing:1px;color:rgba(160,180,220,.5)}
#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:3px;color:#8df;text-shadow:0 0 10px #4cf;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
/* char / shop cards */
#chars{display:flex;gap:10px;justify-content:center;margin:4px 0 16px;flex-wrap:wrap}
.charcard{width:172px;padding:10px 10px 8px;border:1px solid rgba(120,160,220,.35);background:rgba(9,15,32,.85);cursor:pointer;pointer-events:auto;text-align:left;transition:all .12s;position:relative}
.charcard:hover{border-color:var(--c);transform:translateY(-2px)}
.charcard.sel{border-color:var(--c);box-shadow:0 0 14px rgba(90,200,255,.22)}
.charcard.locked{opacity:.6}
.chname{font-size:14px;letter-spacing:2px;text-shadow:0 0 8px currentColor}
.chdesc{font-size:10px;color:#9db4d8;line-height:1.5;margin:5px 0 6px;min-height:30px}
.chwep{font-size:9px;color:#6e86ac;letter-spacing:1px}
.chmark{position:absolute;top:6px;right:8px;font-size:8px;letter-spacing:1px;color:var(--c)}
.chprice{position:absolute;top:5px;right:8px;font-size:10px;color:#ffd24d}
.shoprow{display:flex;align-items:center;gap:12px;padding:7px 12px;border:1px solid rgba(120,160,220,.25);background:rgba(9,15,32,.85);margin-bottom:6px;text-align:left}
.sinfo{flex:1}
.sdesc{display:block;font-size:10px;color:#8fa8c8;margin-top:2px}
.spips{display:flex;gap:3px}
.spips .pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
.spips .pip.on{background:#ffd24d;box-shadow:0 0 6px #ffd24d}
.sbuy{pointer-events:auto;font-family:inherit;font-size:11px;letter-spacing:1px;color:#ffe9a0;background:rgba(30,22,6,.9);border:1px solid #ffd24d;padding:6px 10px;cursor:pointer;min-width:64px}
.sbuy:disabled{opacity:.35;cursor:not-allowed}
.card.gold{border-color:#ffd24d;box-shadow:0 0 20px rgba(255,210,77,.35),inset 0 0 14px rgba(255,210,77,.06)}
.card.gold:hover{border-color:#ffe9a0;box-shadow:0 0 28px rgba(255,210,77,.55)}
/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(4,6,14,.62);pointer-events:none}
.panel{text-align:center;max-width:92vw}
#logo{font-size:min(12vw,88px);letter-spacing:.16em;color:#eafcff;text-shadow:0 0 14px #29e6ff,0 0 46px #1673ff,0 0 110px #0a6cff;line-height:1.05}
#logo .v{color:#ffd7e2;text-shadow:0 0 14px #ff5c8a,0 0 46px #ff1670,0 0 110px #ff2f86}
.sub{font-size:13px;letter-spacing:6px;color:#8fb0d8;margin:10px 0 26px}
.neonbtn{pointer-events:auto;display:inline-block;margin:6px;padding:12px 30px;font-family:inherit;font-size:15px;letter-spacing:3px;color:#bfefff;background:rgba(8,16,34,.85);border:1px solid rgba(110,220,255,.6);cursor:pointer;box-shadow:0 0 14px rgba(60,180,255,.25),inset 0 0 14px rgba(60,180,255,.08);transition:all .15s}
.neonbtn:hover{color:#fff;box-shadow:0 0 24px rgba(90,220,255,.55),inset 0 0 18px rgba(90,220,255,.15);transform:translateY(-1px)}
.neonbtn.warn{color:#ffd0da;border-color:rgba(255,100,130,.6);box-shadow:0 0 14px rgba(255,60,110,.25),inset 0 0 14px rgba(255,60,110,.08)}
.neonbtn.warn:hover{box-shadow:0 0 24px rgba(255,80,130,.5),inset 0 0 18px rgba(255,80,130,.14)}
.neonbtn.locked{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
.stats{font-size:13px;line-height:2;color:#a8c4e8;letter-spacing:1px;margin:14px 0}
.stats b{color:#eaffff;text-shadow:0 0 8px #6cf}
#cards{display:flex;gap:14px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.card{pointer-events:auto;width:216px;padding:16px 14px 14px;text-align:left;background:rgba(9,15,34,.92);border:1px solid rgba(110,200,255,.45);cursor:pointer;transition:all .12s;position:relative}
.card:hover{transform:translateY(-3px);border-color:#7df9ff;box-shadow:0 0 22px rgba(80,200,255,.4)}
.card .chead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .cico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;letter-spacing:1px;border:1px solid currentColor;box-shadow:0 0 10px currentColor,inset 0 0 8px rgba(255,255,255,.08)}
.card .cimg{width:36px;height:36px;flex:none}
.card .cname{font-size:13px;letter-spacing:1px;color:#eaffff;line-height:1.3}
.card .clvl{font-size:10px;color:#8fa8c8;margin-top:2px;letter-spacing:1px}
.card .cdesc{font-size:11px;line-height:1.65;color:#a9c0e0}
.card .ckey{position:absolute;top:8px;right:10px;font-size:11px;color:#5f7ba0}
.card .new{color:#ffd24d;text-shadow:0 0 8px #ffa64d}
.small{font-size:11px;color:#6e86ac;letter-spacing:1px;margin-top:18px;line-height:1.9}
.big{font-size:min(9vw,54px);letter-spacing:.14em;margin-bottom:6px}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 52%,rgba(255,25,60,.5));opacity:0}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="xpwrap"><div id="xpbar"></div></div>
  <div id="topline"><span id="lvl">LV 1</span><span id="time">0:00</span><span id="kills">0 KILLS</span><span id="coins" style="color:#ffd24d">0 C</span></div>
  <div id="hpwrap"><div id="hpghost"></div><div id="hpbar"></div></div><div id="hptext">100</div>
  <div id="weps"></div>
  <div id="dash"><span id="dashtext">DASH READY</span><div id="dashbar"><div id="dashfill"></div></div></div>
  <div id="bossbar" class="hidden"><div id="bossname"></div><div id="bosshpwrap"><div id="bosshp"></div></div></div>
  <div id="hint">ESC PAUSE &middot; M MUTE</div>
</div>
<div id="toast"></div>
<div id="hurt"></div>
<div id="overlay"></div>

<script>
(() => {
'use strict';
/* ============================================================ utils */
const TAU = Math.PI * 2;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const pick = arr => arr[(Math.random() * arr.length) | 0];
const fmtTime = t => { t = Math.max(0, t | 0); return ((t / 60) | 0) + ':' + String(t % 60).padStart(2, '0'); };
const $ = id => document.getElementById(id);

/* ============================================================ debug params */
const QS = new URLSearchParams(location.search);
const DBG = {
  fast: Math.min(+QS.get('fast') || 1, 20),
  bot: QS.get('bot') === '1',
  god: QS.get('god') === '1',
  t0: +QS.get('t') || 0,
  lvl: +QS.get('lvl') || 0,
  boss: +QS.get('boss') || 0,
  debug: QS.has('debug'),
};

/* ============================================================ audio */
const AU = (() => {
  let ac = null, master, sfx, musicG, muted = false, musicTimer = null, noiseBuf = null;
  const last = {};
  function init() {
    if (ac) return;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      sfx = ac.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
      musicG = ac.createGain(); musicG.gain.value = 0.3; musicG.connect(master);
    } catch (e) { ac = null; }
  }
  function resume() { init(); if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); }
  function env(g, t0, a, d, peak) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
  function tone(o) {
    if (!ac || muted) return;
    const { f = 440, f2 = 0, type = 'square', dur = 0.1, vol = 0.15, delay = 0, dst = sfx } = o;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator(); osc.type = type;
    osc.frequency.setValueAtTime(Math.max(f, 1), t0);
    if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t0 + dur);
    const g = ac.createGain(); env(g, t0, 0.004, dur, vol);
    osc.connect(g); g.connect(dst); osc.start(t0); osc.stop(t0 + dur + 0.15);
  }
  function noise(o) {
    if (!ac || muted) return;
    const { dur = 0.1, vol = 0.15, freq = 1200, q = 1, delay = 0 } = o;
    if (!noiseBuf) {
      const n = (ac.sampleRate * 0.5) | 0;
      noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = freq; fl.Q.value = q;
    const g = ac.createGain(); env(g, t0, 0.003, dur, vol);
    src.connect(fl); fl.connect(g); g.connect(sfx); src.start(t0); src.stop(t0 + dur + 0.1);
  }
  function throttled(key, ms) { const now = performance.now(); if (last[key] && now - last[key] < ms) return false; last[key] = now; return true; }
  // ------- music: dark synth loop, 8th-note scheduler
  const BPM = 116, STEP = 60 / BPM / 2;
  let step = 0, nextT = 0;
  const ROOTS = [110, 110, 82.41, 98]; // A2 A2 E2 G2
  function scheduleStep(s, t) {
    const bar = (s >> 3) & 3, st = s & 7, root = ROOTS[bar];
    const delay = t - ac.currentTime;
    const boss = typeof G !== 'undefined' && G && G.boss;
    if (st === 0 || st === 4) tone({ f: 120, f2: 38, type: 'sine', dur: 0.13, vol: 0.34, delay, dst: musicG });
    tone({ f: root, type: 'triangle', dur: 0.2, vol: st % 4 === 0 ? 0.16 : 0.09, delay, dst: musicG });
    if (boss) tone({ f: root * 0.5, type: 'sawtooth', dur: 0.22, vol: 0.06, delay, dst: musicG });
    if (st % 2 === 0) {
      const ratios = [1, 1.189, 1.498, 2];
      tone({ f: root * 2 * ratios[(st >> 1) & 3], type: 'sine', dur: 0.14, vol: 0.05, delay, dst: musicG });
    }
    if (st % 2 === 1 || boss) noise({ dur: 0.03, vol: boss ? 0.05 : 0.028, freq: 7000, q: 0.7, delay });
  }
  function musicTick() {
    if (!ac || muted) return;
    while (nextT < ac.currentTime + 0.18) { scheduleStep(step, nextT); step = (step + 1) % 32; nextT += STEP; }
  }
  function startMusic() { init(); if (!ac || musicTimer) return; nextT = ac.currentTime + 0.06; musicTimer = setInterval(musicTick, 42); }
  function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; return muted; }
  return {
    resume, startMusic, toggleMute,
    shoot() { if (throttled('sh', 45)) tone({ f: 880, f2: 220, type: 'square', dur: 0.06, vol: 0.045 }); },
    hit() { if (throttled('hi', 40)) { tone({ f: 200, f2: 90, type: 'sawtooth', dur: 0.05, vol: 0.06 }); } },
    kill() { if (throttled('ki', 35)) { tone({ f: 300, f2: 70, type: 'square', dur: 0.09, vol: 0.1 }); noise({ dur: 0.06, vol: 0.05, freq: 900 }); } },
    gem() { if (throttled('ge', 28)) tone({ f: 620 + G.combo * 26, f2: 900 + G.combo * 30, type: 'sine', dur: 0.07, vol: 0.06 }); },
    heal() { tone({ f: 520, f2: 1040, type: 'sine', dur: 0.22, vol: 0.14 }); },
    bomb() { noise({ dur: 0.5, vol: 0.3, freq: 300, q: 0.4 }); tone({ f: 90, f2: 30, type: 'sine', dur: 0.5, vol: 0.4 }); },
    hurt() { tone({ f: 160, f2: 55, type: 'sawtooth', dur: 0.18, vol: 0.2 }); noise({ dur: 0.12, vol: 0.12, freq: 500 }); },
    dash() { noise({ dur: 0.14, vol: 0.1, freq: 2200, q: 1.5 }); tone({ f: 300, f2: 900, type: 'sine', dur: 0.12, vol: 0.07 }); },
    nova() { tone({ f: 70, f2: 240, type: 'sine', dur: 0.25, vol: 0.22 }); noise({ dur: 0.18, vol: 0.1, freq: 700, q: 0.5 }); },
    zap() { if (throttled('za', 60)) { noise({ dur: 0.08, vol: 0.09, freq: 3200, q: 2 }); tone({ f: 1400, f2: 300, type: 'sawtooth', dur: 0.07, vol: 0.05 }); } },
    levelup() { [523, 659, 784, 1047].forEach((f, i) => tone({ f, type: 'square', dur: 0.12, vol: 0.1, delay: i * 0.07 })); },
    boss() { tone({ f: 65, f2: 30, type: 'sawtooth', dur: 0.8, vol: 0.35 }); noise({ dur: 0.7, vol: 0.2, freq: 220, q: 0.5 }); tone({ f: 66, type: 'square', dur: 0.5, vol: 0.12, delay: 0.15 }); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.25, vol: 0.14, delay: i * 0.11 })); },
    dead() { [400, 300, 200, 120].forEach((f, i) => tone({ f, f2: f * 0.6, type: 'sawtooth', dur: 0.3, vol: 0.14, delay: i * 0.14 })); },
    evolve() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.18, vol: 0.12, delay: i * 0.06 })); noise({ dur: 0.4, vol: 0.05, freq: 5200, q: 2, delay: 0.34 }); },
    chest() { tone({ f: 660, type: 'square', dur: 0.09, vol: 0.11 }); tone({ f: 990, type: 'square', dur: 0.16, vol: 0.11, delay: 0.09 }); },
    buy() { tone({ f: 520, type: 'square', dur: 0.06, vol: 0.09 }); tone({ f: 780, type: 'square', dur: 0.1, vol: 0.09, delay: 0.07 }); },
  };
})();

/* ============================================================ save */
let SAVE = { best: 0, wins: 0, nightmare: false, tk: 0, coins: 0, meta: {}, chars: { vesper: true }, sel: 'vesper' };
try {
  const s = JSON.parse(localStorage.getItem('neonvoid_v1'));
  if (s) {
    Object.assign(SAVE, s);
    SAVE.meta = s.meta || {};
    SAVE.chars = Object.assign({ vesper: true }, s.chars || {});
  }
} catch (e) {}
function persist() { try { localStorage.setItem('neonvoid_v1', JSON.stringify(SAVE)); } catch (e) {} }

/* ============================================================ canvas */
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SKY = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  buildSky();
}
resize(); addEventListener('resize', resize);

/* glow sprite cache */
const glowCache = new Map();
function glowSprite(col) {
  let s = glowCache.get(col);
  if (s) return s;
  const r = 48, c = document.createElement('canvas'); c.width = c.height = r * 2;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(r, r, 0, r, r, r);
  gr.addColorStop(0, col); gr.addColorStop(0.35, col + '80'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
  glowCache.set(col, c); return c;
}
function drawGlow(x, y, r, col, alpha) {
  ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'lighter';
  const s = glowSprite(col);
  ctx.drawImage(s, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function polyG(g, x, y, r, n, rot) {
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
function poly(x, y, r, n, rot) { polyG(ctx, x, y, r, n, rot); }

/* ---------- pre-rendered sprite art (crisp 2x, + white flash variant) ---------- */
function makeSprite(sz, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = sz * 4;
  const g = c.getContext('2d');
  g.scale(2, 2); g.translate(sz, sz);
  g.lineJoin = 'round'; g.lineCap = 'round';
  draw(g);
  const f = document.createElement('canvas');
  f.width = c.width; f.height = c.height;
  const fg = f.getContext('2d');
  fg.drawImage(c, 0, 0);
  fg.globalCompositeOperation = 'source-in';
  fg.fillStyle = '#ffffff'; fg.fillRect(0, 0, f.width, f.height);
  return { img: c, flash: f, half: sz };
}
function drawSprite(spr, x, y, rot, k, flash) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  const s = spr.half * (k || 1);
  ctx.drawImage(flash ? spr.flash : spr.img, -s, -s, s * 2, s * 2);
  ctx.restore();
}
const SPRITES = {};
{
  SPRITES.chaser = makeSprite(24, g => {
    g.beginPath();
    g.moveTo(15, 0); g.lineTo(-3, 8); g.lineTo(-8, 4); g.lineTo(-14, 7); g.lineTo(-10, 0); g.lineTo(-14, -7); g.lineTo(-8, -4); g.lineTo(-3, -8);
    g.closePath();
    g.fillStyle = '#8f1830'; g.fill();
    g.strokeStyle = '#ff4d6d'; g.lineWidth = 1.6; g.stroke();
    g.fillStyle = '#ffd7e0';
    g.beginPath(); g.arc(5, 0, 2.2, 0, TAU); g.fill();
  });
  SPRITES.swarmer = makeSprite(16, g => {
    g.beginPath(); g.moveTo(-2, 4); g.lineTo(-10, 9); g.lineTo(-5, 3); g.closePath();
    g.moveTo(-2, -4); g.lineTo(-10, -9); g.lineTo(-5, -3); g.closePath();
    g.fillStyle = '#a05a1c'; g.fill();
    g.beginPath(); g.moveTo(8, 0); g.lineTo(0, 5.5); g.lineTo(-6, 0); g.lineTo(0, -5.5); g.closePath();
    g.fillStyle = '#7a4413'; g.fill();
    g.strokeStyle = '#ffb84d'; g.lineWidth = 1.4; g.stroke();
    g.fillStyle = '#ffe2b0';
    g.beginPath(); g.arc(1, 0, 1.8, 0, TAU); g.fill();

/* baked sky (nebula clouds, half-res, redrawn only on resize) */
function buildSky() {
  const w = Math.max(320, (W / 2) | 0), h = Math.max(200, (H / 2) | 0);
  SKY = document.createElement('canvas');
  SKY.width = w; SKY.height = h;
  const g = SKY.getContext('2d');
  const defs = [['#5b2bff', 0.30], ['#1b6bff', 0.26], ['#0ea8a0', 0.2], ['#5b2bff', 0.16], ['#1b6bff', 0.14]];
  const spots = [[0.22, 0.3], [0.72, 0.62], [0.5, 0.12], [0.88, 0.85], [0.12, 0.82]];
  defs.forEach(([col, a], i) => {
    const R = h * 0.95;
    const cx2 = spots[i][0] * w, cy2 = spots[i][1] * h;
    const gr = g.createRadialGradient(cx2, cy2, 0, cx2, cy2, R);
    gr.addColorStop(0, col + Math.round(a * 255).toString(16).padStart(2, '0'));
    gr.addColorStop(0.55, col + '12');
    gr.addColorStop(1, col + '00');
    g.fillStyle = gr;
    g.fillRect(0, 0, w, h);
  });
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  Input.k[e.code] = true;
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  AU.resume();
  if (c === 'KeyM') { toast(AU.toggleMute() ? 'SOUND OFF' : 'SOUND ON'); return; }
  if (G.state === 'shop') {
    if (c === 'Escape' || c === 'KeyT' || c === 'Enter') showTitle();

  }
  if (G.state === 'levelup') {
    if (c === 'Digit1' || c === 'Numpad1') chooseCard(0);
    else if (c === 'Digit2' || c === 'Numpad2') chooseCard(1);
    else if (c === 'Digit3' || c === 'Numpad3') chooseCard(2);
    else if (c === 'KeyR') rerollCards();
    return;
  }
  if (c === 'Space' || c === 'ShiftLeft' || c === 'ShiftRight') Input.dashQueued = true;
  if (c === 'Escape' || c === 'KeyP') {
    if (G.state === 'playing') pauseGame();
    else if (G.state === 'paused') resumeGame();

cv.addEventListener('touchstart', e => {

  for (const t of e.changedTouches) {
    if (t.clientX < W / 2 && !Input.touch) Input.touch = { id: t.identifier, ox: t.clientX, oy: t.clientY, x: t.clientX, y: t.clientY };
    else Input.dashQueued = true;
  }
  if (G.state === 'title') startRun(G.diff);
  e.preventDefault();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  if (Input.touch) for (const t of e.changedTouches) if (t.identifier === Input.touch.id) { Input.touch.x = t.clientX; Input.touch.y = t.clientY; }
  e.preventDefault();
}, { passive: false });
cv.addEventListener('touchend', e => {
  if (Input.touch) for (const t of e.changedTouches) if (t.identifier === Input.touch.id) Input.touch = null;
  e.preventDefault();
}, { passive: false });
function readMove() {
  let mx = 0, my = 0;
  const k = Input.k;
  if (k.KeyA || k.ArrowLeft) mx -= 1;
  if (k.KeyD || k.ArrowRight) mx += 1;
  if (k.KeyW || k.ArrowUp) my -= 1;
  if (k.KeyS || k.ArrowDown) my += 1;
  if (Input.touch) {
    const dx = Input.touch.x - Input.touch.ox, dy = Input.touch.y - Input.touch.oy;
    const m = Math.hypot(dx, dy);
    if (m > 8) { mx += dx / Math.max(m, 55); my += dy / Math.max(m, 55); }
  }
  if (DBG.bot) { mx = Bot.mx; my = Bot.my; }
  const m = Math.hypot(mx, my);
  if (m > 1) { mx /= m; my /= m; }
  return [mx, my];
}

  for (let i = 0; i < n; i++) {
    const a = rand(TAU), r = rand(rMin || R * 0.9, rMax || R * 1.15);
    spawnEnemy(type, G.p.x + Math.cos(a) * r, G.p.y + Math.sin(a) * r);
  }
}
function updateSpawner(dt) {
  const t = G.time, p = G.p;
  if (G.grace > 0) { G.grace -= dt; return; }
  // authored wave events
  const R0 = Math.hypot(W, H) / 2;
  while (G.evIdx < EVENTS.length && t >= EVENTS[G.evIdx].t) {
    const ev = EVENTS[G.evIdx++];
    const nm = G.diffKey === 'nightmare' ? 1.4 : 1;
    if (ev.ring) {
      spawnRing(ev.ring, Math.round(ev.n * nm), R0 - 40, R0 + 50);
      toast('WAVE INCOMING'); shake(4); AU.boss();
    }
    if (ev.elite) {
      for (let i = 0; i < ev.n; i++) {
        const a = rand(TAU);
        spawnElite(ev.elite, p.x + Math.cos(a) * (R0 - 60), p.y + Math.sin(a) * (R0 - 60));
      }
      toast('ELITE PACK'); AU.boss();
    }
  }
  if (t < 20 && G.enemies.length > 14) return; // soft opening
  G.spawnAcc += epsAt(t) * dt * (G.boss ? 0.45 : 1);
  while (G.spawnAcc >= 1) {
    G.spawnAcc -= 1;
    const R = Math.hypot(W, H) / 2 + 30, a = rand(TAU), r = R * rand(0.95, 1.15);
    let type = 'chaser';
    const roll = Math.random();
    if (t > 45 && roll < 0.3) type = 'swarmer';
    else if (t > 100 && roll < 0.42) type = 'tank';
    else if (t > 170 && roll < 0.55) type = 'spitter';
    else if (t > 260 && roll < 0.68) type = 'splitter';
    const x = G.p.x + Math.cos(a) * r, y = G.p.y + Math.sin(a) * r;
    const eliteChance = clamp((t - 120) / 3600, 0, 0.09);
    if (type !== 'swarmer' && Math.random() < eliteChance) spawnElite(type, x, y);
    else spawnEnemy(type, x, y);
  }
  // bosses
  const def = BOSSES[G.bossIdx];
  if (def && t >= def.t && !G.boss) { G.bossIdx++; spawnBoss(def); }
}
function updateEnemies(dt) {
  const p = G.p, t = G.time;
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.born = Math.min(1, e.born + dt * 4);
    e.flash -= dt; e.slowT -= dt; e.orbitCd -= dt;
    const sm = e.slowT > 0 ? 0.72 : 1;
    let mvx = 0, mvy = 0;
    const dx = p.x - e.x, dy = p.y - e.y, dist = Math.hypot(dx, dy) || 1;
    if (e.boss) { bossAI(e, dt, dist, dx, dy); }
    else if (e.type === 'spitter') {
      e.rot = Math.atan2(dy, dx);
      const want = 260;
      const dir = dist > want + 50 ? 1 : dist < want - 50 ? -1 : 0;
      mvx = (dx / dist) * dir + (-dy / dist) * 0.5;
      mvy = (dy / dist) * dir + (dx / dist) * 0.5;
      e.shootCd -= dt;
      if (e.shootCd <= 0 && dist < 520) {
        e.shootCd = 2.6;
        const a = Math.atan2(dy, dx);
        G.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 165, vy: Math.sin(a) * 165, life: 6, r: 5, dmg: 10 * dmgMulAt(t) * G.diff.dmgM });
      }
    } else if (e.type === 'swarmer' || e.type === 'mini') {
      e.zig += dt * 6;
      const px = -dy / dist, py = dx / dist;
      mvx = dx / dist + px * Math.sin(e.zig) * 0.55;
      mvy = dy / dist + py * Math.sin(e.zig) * 0.55;
    } else {
      mvx = dx / dist; mvy = dy / dist;
    }
    let sp = e.spd * sm;
    // rubber-band: distant stragglers speed up so the horde re-engages
    if (dist > 480) sp *= 1 + Math.min((dist - 480) / 320, 1) * 1.25;
    e.x += (mvx * sp + e.kx) * dt;
    e.y += (mvy * sp + e.ky) * dt;
    e.kx *= Math.exp(-7 * dt); e.ky *= Math.exp(-7 * dt);
    if (e.type === 'chaser' || e.type === 'mini') e.rot = Math.atan2(dy, dx);
    else if (e.type === 'swarmer' || e.type === 'splitter') e.rot += dt * 3;
    else if (e.type === 'tank') e.rot += dt * 0.7;
    // too far -> reposition just off-screen so pressure returns
    const R2 = Math.hypot(W, H) / 2 + 40;
    if (dist > R2 + 240) {
      const a = rand(TAU);
      e.x = p.x + Math.cos(a) * R2; e.y = p.y + Math.sin(a) * R2;
    }
  }
}
function bossAI(e, dt, dist, dx, dy) {
  const p = G.p;
  // anti-stall: the longer a boss goes untouched, the faster it hunts
  e.aliveT = (e.aliveT || 0) + dt;
  const rage = 1 + Math.min(e.aliveT / 25, 1.6);
  if (!e.rage1 && e.aliveT > 25) { e.rage1 = true; toast(e.name + ' ENRAGES'); e.flash = 0.5; AU.boss(); }
  if (!e.rage2 && e.aliveT > 55) { e.rage2 = true; toast(e.name + ' FRENZIES'); e.flash = 0.5; shake(8); AU.boss(); }
  if (e.type === 'warden') {
    const mvx = dx / dist, mvy = dy / dist;
    e.x += mvx * e.spd * rage * dt; e.y += mvy * e.spd * rage * dt;
    e.rot += dt;
    e.a1 -= dt * rage; e.a2 -= dt * rage;
    if (e.a1 <= 0) {
      e.a1 = 3.0;
      for (let i = 0; i < 10; i++) {
        const a = i * TAU / 10 + rand(0.3);
        G.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 155, vy: Math.sin(a) * 155, life: 7, r: 5, dmg: 12 * dmgMulAt(G.time) * G.diff.dmgM });
      }
      AU.nova();
    }
    if (e.a2 <= 0) { e.a2 = 11; spawnRing('swarmer', 4, 60, 90); toast('SWARM CALLED'); }
  } else if (e.type === 'devourer') {
    e.rot += dt * 0.5;
    e.stT -= dt;
    if (e.state === 'chase') {
      e.x += (dx / dist) * e.spd * 1.4 * rage * dt; e.y += (dy / dist) * e.spd * 1.4 * rage * dt;
      if (e.stT <= 0) { e.state = 'tel'; e.stT = 0.7; AU.boss(); }
    } else if (e.state === 'tel') {
      e.cdx = dx / dist; e.cdy = dy / dist;
      if (e.stT <= 0) { e.state = 'charge'; e.stT = 0.55; shake(6); }
    } else if (e.state === 'charge') {
      e.x += e.cdx * 620 * dt; e.y += e.cdy * 620 * dt;
      if (e.stT <= 0) { e.state = 'chase'; e.stT = 4.2 / rage; }
    }
    e.a1 -= dt * rage;
    if (e.a1 <= 0 && e.state !== 'charge') {
      e.a1 = 3.6;
      const base = Math.atan2(dy, dx);
      for (let i = -1; i <= 1; i++) {
        const a = base + i * 0.22;
        G.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 175, vy: Math.sin(a) * 175, life: 7, r: 5, dmg: 13 * dmgMulAt(G.time) * G.diff.dmgM });
      }
    }
  } else if (e.type === 'crown') {
    if (e.phase === 1 && e.hp < e.maxhp * 0.5) {
      e.phase = 2; e.spd = 72; e.flash = 0.5; shake(14); hitstop(0.12); AU.boss();
      toast('THE CROWN ANGERS');
      ring(e.x, e.y, 260, 0.6, '#eaffff');
    }
    const spd = (e.phase === 1 ? 66 : 88) * rage;
    if (e.spiral < 0) {
      e.x += (dx / dist) * spd * dt; e.y += (dy / dist) * spd * dt;
      e.a1 -= dt;
      if (e.a1 <= 0) { e.spiral = e.phase === 1 ? 2.2 : 3.0; e.spiralA = rand(TAU); e.a1 = e.phase === 1 ? 6.5 : 5.2; }
    } else {
      e.spiral -= dt; e.spiralA += dt * 4.2;
      e.x += (dx / dist) * spd * 0.4 * dt; e.y += (dy / dist) * spd * 0.4 * dt;
      e.sT = (e.sT || 0) - dt;
      if (e.sT <= 0) {
        e.sT = 0.09;
        const bs = e.phase === 1 ? 150 : 172;
        for (const off of [0, Math.PI]) {
          const a = e.spiralA + off;
          G.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * bs, vy: Math.sin(a) * bs, life: 7, r: 5, dmg: 14 * dmgMulAt(G.time) * G.diff.dmgM });
        }
      }
      if (e.spiral <= 0) e.spiral = -1;
    }
    e.a2 -= dt;
    if (e.a2 <= 0) {
      e.a2 = e.phase === 1 ? 11 : 8;
      for (let i = 0; i < 2; i++) {
        const a = rand(TAU);
        spawnElite(pick(['chaser', 'tank', 'spitter']), e.x + Math.cos(a) * 90, e.y + Math.sin(a) * 90);
      }
      toast('ELITES SUMMONED');
    }
  }
}
function hurtEnemy(e, dmg, o = {}) {
  if (e.dead) return;
  let dd = dmg, crit = false;
  if (Math.random() < 0.1) { dd *= 2; crit = true; }
  e.hp -= dd; e.flash = 0.09;
  if (o.kx) { e.kx += o.kx; e.ky += o.ky; }
  if (!o.quiet) addText(e.x, e.y - e.r - 4, Math.round(dd), crit ? '#ffd24d' : '#ffffff', crit ? 13 : 11);
  sparks(e.x, e.y, e.col, 2);
  AU.hit();
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  G.kills++; SAVE.tk++;
  shardBurst(e.x, e.y, e.col, e.boss ? 50 : e.elite ? 22 : 8, e.boss ? 360 : 250);
  burst(e.x, e.y, e.col, e.boss ? 30 : 5, 190, 0.5, 2.6);
  AU.kill();
  if (e.elite) { shake(5); hitstop(0.05); ring(e.x, e.y, 90, 0.4, e.col); }
  // gems
  const val = Math.round(e.xp * G.diff.xpM);
  if (val > 0) dropGem(e.x, e.y, val);
  // drops
  if (e.boss) {
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8; dropGem(e.x + Math.cos(a) * 46, e.y + Math.sin(a) * 46, 10); }
    G.pickups.push({ x: e.x + 30, y: e.y, type: 'heal' }, { x: e.x - 30, y: e.y, type: 'bomb' }, { x: e.x, y: e.y + 42, type: 'chest' });
    bossDown(e);
  } else {
    const r = Math.random();
    if (e.elite && r < 0.35) G.pickups.push({ x: e.x, y: e.y, type: 'chest' });
    else if (r < 0.022) G.pickups.push({ x: e.x, y: e.y, type: 'heal' });
    else if (r < 0.032) G.pickups.push({ x: e.x, y: e.y, type: 'bomb' });
  }
  if (e.type === 'splitter') {
    for (let i = 0; i < 4; i++) {
      const m = spawnEnemy('mini', e.x + rand(-16, 16), e.y + rand(-16, 16));
      if (m) { m.born = 0.2; }
    }
  }
}
function bossDown(e) {
  $('bossbar').classList.add('hidden');
  G.boss = null;
  G.bossKills++;
  shake(16); hitstop(0.2);
  ring(e.x, e.y, 320, 0.9, '#ffffff');
  if (e.final) {
    toast('THE CROWN SHATTERS');
    for (const o of G.enemies) if (!o.dead && !o.boss) { o.dead = true; burst(o.x, o.y, o.col, 6, 180, 0.5, 2.5); }
    G.winT = 1.4;
    AU.win();
  } else { toast(e.name + ' DOWN'); }
}
function dropGem(x, y, val) {
  if (G.gems.length > 340) { const old = G.gems.shift(); if (G.gems.length) G.gems[G.gems.length - 1].v += old.v; }
  G.gems.push({ x, y, v: val, t: rand(TAU) });
}

/* ============================================================ weapons */
function recompute() {
  const p = G.p, ps = p.passives, M = SAVE.meta || {}, C = G.char || CHARS.vesper;
  p.maxhp = C.hp + 25 * (ps.plating || 0) + 10 * (M.vitality || 0);
  p.spd = C.spd * (1 + 0.09 * (ps.servo || 0)) * (1 + 0.04 * (M.haste || 0));
  p.dmgMul = (C.dmgMul || 1) * (1 + 0.12 * (ps.overclock || 0)) * (1 + 0.05 * (M.might || 0));
  p.cdMul = (C.cdMul || 1) * Math.pow(0.92, ps.reactor || 0);
  p.magnet = 72 * (1 + 0.45 * (ps.magnet || 0)) * (1 + 0.15 * (M.magnet || 0));
  p.regen = 0.7 * (ps.nanites || 0) + (C.regen || 0);
  p.armor = C.armor || 1;
  p.xpMul = (C.xpMul || 1) * (1 + 0.05 * (M.growth || 0));
  p.hp = Math.min(p.hp, p.maxhp);
  return p;
}
function fireWeapons(dt) {
  const p = G.p;
  for (const w of p.weapons) {
    const D = WEAPONS[w.id], L = w.lvl;
    if (w.id === 'orbit') {
      w.data.rot = (w.data.rot || 0) + dt * (w.evo ? 3.6 : 2.6 + 0.16 * L);
      const n = w.evo ? 8 : D.blades[L - 1];
      const rad = w.evo ? 120 + Math.sin(G.time * 1.7) * 38 : D.rad[L - 1];
      const dmg = (w.evo ? 30 : D.dmg[L - 1]) * p.dmgMul;
      for (let i = 0; i < n; i++) {
        const a = w.data.rot + i * TAU / n;
        const bx = p.x + Math.cos(a) * rad, by = p.y + Math.sin(a) * rad;
        for (const e of query(bx, by, 66)) {
          if (e.dead || e.orbitCd > 0) continue;
          if (d2(bx, by, e.x, e.y) < (16 + e.r) * (16 + e.r)) {
            const ka = Math.atan2(e.y - p.y, e.x - p.x);
            hurtEnemy(e, dmg, { kx: Math.cos(ka) * 160, ky: Math.sin(ka) * 160 });
            if (w.evo) e.slowT = Math.max(e.slowT, 0.5);
            e.orbitCd = 0.38;
          }
        }
      }
      continue;
    }
    if (w.id === 'aura') {
      w.cd -= dt;
      if (w.cd <= 0) {
        w.cd = 0.35;
        const rad = w.evo ? 175 : D.rad[L - 1], dmg = (w.evo ? 45 : D.dps[L - 1]) * 0.35 * p.dmgMul;
        let hits = 0;
        for (const e of query(p.x, p.y, rad + 60)) {
          if (e.dead) continue;
          if (d2(p.x, p.y, e.x, e.y) < (rad + e.r) * (rad + e.r)) {
            hurtEnemy(e, dmg, { quiet: true });
            e.slowT = Math.max(e.slowT, w.evo ? 0.6 : 0.5);
            hits++;
          }
        }
        if (w.evo && hits >= 3) p.hp = Math.min(p.maxhp, p.hp + 1);
      }
      continue;
    }
    if (w.id === 'drone') {
      if (!w.data.ang) w.data = { cds: w.data.cds || [0], ang: 0 };
      w.data.ang += dt * 1.5;
      const n = w.evo ? 6 : D.n[L - 1];
      while (w.data.cds.length < n) w.data.cds.push(rand(0.2, 0.7));
      for (let i = 0; i < n; i++) {
        w.data.cds[i] -= dt;
        if (w.data.cds[i] > 0) continue;
        const a = w.data.ang + i * TAU / n;
        const dx = p.x + Math.cos(a) * (w.evo ? 44 : 34), dy = p.y + Math.sin(a) * (w.evo ? 44 : 34);
        const tgt = nearestEnemy(dx, dy, 560);
        if (!tgt) { w.data.cds[i] = 0.15; continue; }
        const ta = Math.atan2(tgt.y - dy, tgt.x - dx);
        const shots = w.evo ? 3 : 1, dmg = (w.evo ? 16 : D.dmg[L - 1]) * p.dmgMul;
        for (let s = 0; s < shots; s++) {
          const sa = ta + (s - (shots - 1) / 2) * 0.12;
          G.bullets.push({ x: dx, y: dy, vx: Math.cos(sa) * 430, vy: Math.sin(sa) * 430, dmg, r: 4, life: 2.4, pierce: w.evo ? 1 : 0, col: w.evo ? '#ffc98a' : '#ffb066', home: 5 });
        }
        w.data.cds[i] = (w.evo ? 0.9 : D.cd[L - 1]) * p.cdMul;
      }
      continue;
    }
    w.cd -= dt;
    if (w.cd > 0) continue;
    if (w.id === 'pulse') {
      const e = nearestEnemy(p.x, p.y, 660);
      if (!e) { w.cd = 0.12; continue; }
      const base = Math.atan2(e.y - p.y, e.x - p.x);
      if (w.evo) {
        G.bullets.push({ x: p.x, y: p.y, vx: Math.cos(base) * 900, vy: Math.sin(base) * 900, dmg: 70 * p.dmgMul, r: 6, life: 1.5, pierce: 99, col: '#eaffff', big: true });
        w.cd = 0.6 * p.cdMul;
        shake(1.2);
      } else {
        const n = D.n[L - 1], dmg = D.dmg[L - 1] * p.dmgMul;
        for (let i = 0; i < n; i++) {
          const a = base + (i === 0 ? 0 : (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 0.1);
          G.bullets.push({ x: p.x, y: p.y, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, dmg, r: 5, life: 1.3, pierce: L >= 5 ? 1 : 0, col: '#7df9ff' });
        }
        w.cd = D.cd[L - 1] * p.cdMul;
      }
      AU.shoot();
    } else if (w.id === 'nova') {
      const rad = w.evo ? 260 : D.rad[L - 1], dmg = (w.evo ? 60 : D.dmg[L - 1]) * p.dmgMul;
      ring(p.x, p.y, rad, 0.38, w.evo ? '#ffe9a0' : '#ffd24d');
      if (w.evo) ring(p.x, p.y, rad * 0.72, 0.3, '#fff6d8');
      for (const e of query(p.x, p.y, rad + 60)) {
        if (e.dead) continue;
        if (d2(p.x, p.y, e.x, e.y) < (rad + e.r) * (rad + e.r)) {
          const a = Math.atan2(e.y - p.y, e.x - p.x);
          hurtEnemy(e, dmg, { kx: Math.cos(a) * (w.evo ? 400 : 240), ky: Math.sin(a) * (w.evo ? 400 : 240) });
        }
      }
      w.cd = (w.evo ? 1.5 : D.cd[L - 1]) * p.cdMul;
      AU.nova(); shake(w.evo ? 6 : 2.5);
    } else if (w.id === 'chain') {
      const n = w.evo ? 12 : D.n[L - 1], dmg = (w.evo ? 44 : D.dmg[L - 1]) * p.dmgMul;
      let cur = nearestEnemy(p.x, p.y, 320);
      if (!cur) { w.cd = 0.15; continue; }
      const hit = new Set();
      let px = p.x, py = p.y;
      for (let i = 0; i < n && cur; i++) {
        hit.add(cur);
        G.bolts.push({ x1: px, y1: py, x2: cur.x, y2: cur.y, life: 0.14 });
        hurtEnemy(cur, dmg, {});
        if (w.evo) cur.slowT = Math.max(cur.slowT, 0.6);
        px = cur.x; py = cur.y;
        let best = null, bd = (w.evo ? 260 : 210) * (w.evo ? 260 : 210);
        for (const e of query(px, py, 270)) {
          if (e.dead || hit.has(e)) continue;
          const dd = d2(px, py, e.x, e.y);
          if (dd < bd) { bd = dd; best = e; }
        }
        cur = best;
      }
      w.cd = (w.evo ? 1.0 : D.cd[L - 1]) * p.cdMul;
      AU.zap();
    }
  }
}

/* ============================================================ player */
function updatePlayer(dt) {
  const p = G.p;
  if (DBG.god) { p.hp = p.maxhp; }
  p.iframes -= dt; p.dashCd -= dt; p.hurtCd -= dt;
  // regen
  if (p.regen > 0) p.hp = Math.min(p.maxhp, p.hp + p.regen * dt);
  // dash
  if (Input.dashQueued) {
    Input.dashQueued = false;
    if (p.dashCd <= 0) {
      const [mx, my] = readMove();
      p.dashA = (mx || my) ? Math.atan2(my, mx) : p.aim;
      p.dashT = 0.17; p.dashCd = 1.5; p.iframes = Math.max(p.iframes, 0.3);
      AU.dash();
    }
  }
  const dashing = p.dashT > 0;
  if (dashing) {
    p.dashT -= dt;
    p.x += Math.cos(p.dashA) * p.spd * 3.1 * dt;
    p.y += Math.sin(p.dashA) * p.spd * 3.1 * dt;
    G.trail.push({ x: p.x, y: p.y, a: 1, aim: p.aim });
    if (G.trail.length > 14) G.trail.shift();
  } else {
    const [mx, my] = readMove();
    p.x += mx * p.spd * dt; p.y += my * p.spd * dt;
    p.mvx = mx; p.mvy = my;
  }
  for (const tr of G.trail) tr.a -= dt * 4;
  while (G.trail.length && G.trail[0].a <= 0) G.trail.shift();
  // engine exhaust
  if ((p.mvx || p.mvy) && G.particles.length < 420 && Math.random() < 0.45) {
    const a = p.aim + Math.PI;
    G.particles.push({ x: p.x + Math.cos(a) * 13, y: p.y + Math.sin(a) * 13, vx: Math.cos(a) * rand(40, 100), vy: Math.sin(a) * rand(40, 100), life: rand(0.15, 0.3), max: 0.3, col: p.dashT > 0 ? '#eaffff' : '#59d8ff', size: rand(1.2, 2.4), shape: 'dot', rot: 0, vr: 0 });
  }
  // aim: nearest enemy else move dir
  const ne = nearestEnemy(p.x, p.y, 520);
  const tgtA = ne ? Math.atan2(ne.y - p.y, ne.x - p.x) : (p.mvx || p.mvy ? Math.atan2(p.mvy, p.mvx) : p.aim);
  let da = tgtA - p.aim;
  while (da > Math.PI) da -= TAU;
  while (da < -Math.PI) da += TAU;
  p.aim += da * Math.min(1, 14 * dt);
  // contact damage
  if (p.iframes <= 0 && !dashing) {
    for (const e of query(p.x, p.y, 90)) {
      if (e.dead) continue;
      if (d2(p.x, p.y, e.x, e.y) < (e.r + 11) * (e.r + 11)) {
        hurtPlayer(e.dmg * (e.boss && e.state === 'charge' ? 1.4 : 1));
        const a = Math.atan2(e.y - p.y, e.x - p.x);
        e.kx += Math.cos(a) * 220; e.ky += Math.sin(a) * 220;

  }

  for (const g of G.gems) {
    const dd = d2(p.x, p.y, g.x, g.y);
    if (dd < mag * mag) {
      const d = Math.sqrt(dd) || 1;
      const pull = clamp(900 - d * 2, 260, 900);
      g.x += (p.x - g.x) / d * pull * dt;
      g.y += (p.y - g.y) / d * pull * dt;
    }
    if (dd < 22 * 22) { collectGem(g); g.dead = true; }
  }
  G.gems = G.gems.filter(g => !g.dead);
  // pickups
  for (const it of G.pickups) {
    if (d2(p.x, p.y, it.x, it.y) < 30 * 30) {
      it.dead = true;
      if (it.type === 'heal') { p.hp = Math.min(p.maxhp, p.hp + 30); AU.heal(); burst(p.x, p.y, '#5dffa8', 14, 160, 0.5, 2.5); addText(p.x, p.y - 20, '+30 HP', '#5dffa8', 13); }
      else if (it.type === 'chest') grantChest();
      else { AU.bomb(); shake(16); hitstop(0.14); ring(p.x, p.y, 900, 0.6, '#ffb84d'); burst(p.x, p.y, '#ffb84d', 50, 420, 0.7, 3.5);
        for (const e of G.enemies) if (!e.dead && !e.boss) hurtEnemy(e, 400, { quiet: true });
        for (const e of G.enemies) if (!e.dead && e.boss) hurtEnemy(e, 140, {});
      }
    }
  }
  G.pickups = G.pickups.filter(i => !i.dead);
}
function collectGem(g) {
  G.p.xp += g.v * (G.p.xpMul || 1);
  G.combo++; G.comboT = 0.9;
  AU.gem();
  burst(g.x, g.y, '#5dffa8', 3, 100, 0.3, 2);
  while (G.p.xp >= G.p.need) { G.p.xp -= G.p.need; G.p.lvl++; G.p.need = xpNeed(G.p.lvl); G.pendingLv++; }
  if (G.pendingLv > 0 && G.state === 'playing') showLevelUp();
}
function hurtPlayer(d) {
  const p = G.p;
  if (p.iframes > 0) return;
  p.hp -= d * (p.armor || 1); p.iframes = 0.7;
  G.hurtFlash = 1; shake(8); AU.hurt();
  addText(p.x, p.y - 20, '-' + Math.round(d), '#ff5c7a', 14);
  if (p.hp <= 0) {
    if (p.revive > 0) {
      p.revive--;
      p.hp = Math.ceil(p.maxhp * 0.5);
      p.iframes = 2.5;
      ring(p.x, p.y, 260, 0.7, '#7df9ff');
      burst(p.x, p.y, '#7df9ff', 34, 320, 0.7, 3);

    }
    p.hp = 0;

    ring(p.x, p.y, 200, 0.7, '#7df9ff');

}

/* ============================================================ bot (test autoplayer) */
const Bot = { mx: 0, my: 0, t: 0 };
function botUpdate(dt) {
  Bot.t += dt;
  const p = G.p;
  let vx = 0, vy = 0;
  for (const e of query(p.x, p.y, 170)) {
    if (e.dead) continue;
    const d = Math.sqrt(d2(p.x, p.y, e.x, e.y)) || 1;
    const wgt = (170 - d) / 170;
    vx += (p.x - e.x) / d * wgt * wgt * 1.6; vy += (p.y - e.y) / d * wgt * wgt * 1.6;
  }
  for (const b of G.ebullets) {
    const d = Math.sqrt(d2(p.x, p.y, b.x, b.y)) || 1;
    if (d < 120) { const wgt = (120 - d) / 120; vx += (p.x - b.x) / d * wgt * 1.6; vy += (p.y - b.y) / d * wgt * 1.6; }
  }
  let bg = null, bd = 1e9;
  for (const g of G.gems) { const dd = d2(p.x, p.y, g.x, g.y); if (dd < bd) { bd = dd; bg = g; } }
  // chests outrank gems
  let chest = null, cd1 = 1e9;
  for (const it of G.pickups) if (it.type === 'chest') { const dd = d2(p.x, p.y, it.x, it.y); if (dd < cd1) { cd1 = dd; chest = it; } }
  if (chest) { const d = Math.sqrt(cd1) || 1; vx += (chest.x - p.x) / d * 1.2; vy += (chest.y - p.y) / d * 1.2; }
  if (bg) { const d = Math.sqrt(bd); vx += (bg.x - p.x) / d * 0.85; vy += (bg.y - p.y) / d * 0.85; }
  // farm bias: drift toward nearest enemy (or the boss) when nothing to collect
  if (!bg) {
    let ne = G.boss && !G.boss.dead ? G.boss : null, nd = ne ? d2(p.x, p.y, ne.x, ne.y) : 1e9;
    for (const e of G.enemies) { if (e.dead || e.boss) continue; const dd = d2(p.x, p.y, e.x, e.y); if (dd < nd) { nd = dd; ne = e; } }
    if (ne && nd > 130 * 130 && nd < 1200 * 1200) { const d = Math.sqrt(nd); vx += (ne.x - p.x) / d * 0.6; vy += (ne.y - p.y) / d * 0.6; }
  }
  vx += Math.sin(Bot.t * 0.6) * 0.25; vy += Math.cos(Bot.t * 0.83) * 0.25;
  const m = Math.hypot(vx, vy) || 1;
  Bot.mx = vx / m; Bot.my = vy / m;
  if (!Bot.dashT) Bot.dashT = 0;
  Bot.dashT -= dt;
  if (Bot.dashT <= 0) {
    for (const e of query(p.x, p.y, 80)) {
      if (!e.dead && d2(p.x, p.y, e.x, e.y) < 70 * 70) { Input.dashQueued = true; Bot.dashT = 1.4; break; }
    }
  }
}
/* ============================================================ update */
function update(rdt) {
  if (G.state !== 'playing' && G.state !== 'dying') return;
  if (DBG.bot) botUpdate(rdt);
  let dt = rdt;
  if (G.hitstop > 0) { G.hitstop -= rdt; dt *= 0.12; }
  if (G.state === 'dying') {
    G.dieT -= rdt;
    updateParticles(dt);
    G.shake *= Math.exp(-3 * rdt);
    if (G.dieT <= 0) {
      const record = G.time > SAVE.best;
      if (record) SAVE.best = G.time;
      const coins = runCoins();
      SAVE.coins += coins;
      persist();
      G.state = 'dead';
      console.log(`[NV] run ended t=${fmtTime(G.time)} lvl=${G.p.lvl} kills=${G.kills} coins=${coins}`);
      showDead({ time: G.time, lvl: G.p.lvl, kills: G.kills, record, coins });
    }
    return;
  }
  G.time += dt;
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
  updateSpawner(dt);
  updatePlayer(dt);
  G.hpGhost = Math.max(G.p.hp, G.hpGhost - 55 * dt);
  buildGrid();
  updateEnemies(dt);
  G.enemies = G.enemies.filter(e => !e.dead);
  fireWeapons(dt);
  // bullets
  for (const b of G.bullets) {
    if (b.home) {
      const e = nearestEnemy(b.x, b.y, 300);
      if (e) {
        const ta = Math.atan2(e.y - b.y, e.x - b.x);
        let ca = Math.atan2(b.vy, b.vx);
        let da = ta - ca;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        ca += clamp(da, -b.home * dt, b.home * dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(ca) * sp; b.vy = Math.sin(ca) * sp;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    for (const e of query(b.x, b.y, 66)) {
      if (e.dead) continue;
      if (d2(b.x, b.y, e.x, e.y) < (b.r + e.r) * (b.r + e.r)) {
        hurtEnemy(e, b.dmg, {});
        if (b.pierce > 0) { b.pierce--; b.hitSet = b.hitSet || new Set(); b.hitSet.add(e); }
        else b.dead = true;
        break;
      }
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);
  // ebullets
  const p = G.p;
  for (const b of G.ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    if (d2(p.x, p.y, b.x, b.y) < (b.r + 11) * (b.r + 11)) {
      b.dead = true;
      hurtPlayer(b.dmg);
    }
  }
  G.ebullets = G.ebullets.filter(b => !b.dead);
  if (G.ebullets.length > 220) G.ebullets.splice(0, G.ebullets.length - 220);
  updateParticles(dt);
  // fx decay
  G.shake *= Math.exp(-6 * dt);
  G.hurtFlash = Math.max(0, G.hurtFlash - dt * 2.4);
  // win sequence
  if (G.winT > 0) {
    G.winT -= dt;
    if (G.winT <= 0) {
      const nm = G.diffKey === 'nightmare';
      if (!SAVE.nightmare && G.diffKey === 'normal') SAVE.nightmare = true;
      SAVE.wins++; if (G.time > SAVE.best) SAVE.best = G.time;
      const coins = runCoins();
      SAVE.coins += coins;
      persist();
      G.state = 'win';
      console.log(`[NV] run WON t=${fmtTime(G.time)} lvl=${G.p.lvl} kills=${G.kills} coins=${coins}`);
      showWin({ time: G.time, lvl: G.p.lvl, kills: G.kills, nm, coins });
    }
  }
  // camera
  G.cam.x = lerp(G.cam.x, p.x, Math.min(1, 8 * dt));
  G.cam.y = lerp(G.cam.y, p.y, Math.min(1, 8 * dt));
  // hud
  updateHUD();
}
function updateParticles(dt) {
  for (const pt of G.particles) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= Math.exp(-2.2 * dt); pt.vy *= Math.exp(-2.2 * dt);
    if (pt.vr) pt.rot += pt.vr * dt;
    pt.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const t of G.texts) { t.y -= 34 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const r of G.rings) { r.t += dt; r.r = 6 + (r.max - 6) * Math.min(1, r.t / r.dur); }
  G.rings = G.rings.filter(r => r.t < r.dur);
  for (const b of G.bolts) b.life -= dt;
  G.bolts = G.bolts.filter(b => b.life > 0);
}

const stars = [];
for (let i = 0; i < 130; i++) stars.push({ x: rand(-2000, 2000), y: rand(-2000, 2000), z: rand(0.25, 0.7), s: rand(0.6, 1.8) });
function render() {
  const p = G.p;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // bg
  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);
  const shx = G.shake > 0.3 ? rand(-G.shake, G.shake) : 0;
  const shy = G.shake > 0.3 ? rand(-G.shake, G.shake) : 0;
  const cx = G.cam.x + shx, cy = G.cam.y + shy;
  // baked sky with a slow breathing drift
  if (SKY) {
    ctx.globalAlpha = 0.9;
    const sox = Math.sin(G.time * 0.05) * 26, soy = Math.cos(G.time * 0.04) * 20;
    ctx.drawImage(SKY, sox - 30, soy - 24, W + 60, H + 48);
    ctx.globalAlpha = 1;
  }
  // stars (parallax, twinkle)
  ctx.fillStyle = 'rgba(170,195,255,0.6)';
  for (const s of stars) {
    const sx = ((s.x - cx * s.z) % 4000 + 4000) % 4000 - 2000 + W / 2;
    const sy = ((s.y - cy * s.z) % 4000 + 4000) % 4000 - 2000 + H / 2;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.globalAlpha = clamp(0.22 + s.z * 0.5 + Math.sin(G.time * 2.2 + s.x * 0.05) * 0.16, 0.06, 0.85);
    ctx.fillRect(sx, sy, s.s, s.s);
  }

  ctx.save();
  ctx.translate(W / 2 - cx, H / 2 - cy);
  // grid

  ctx.lineWidth = 1;
  const gs = 120;

  const gy0 = Math.floor((cy - H / 2) / gs) * gs, gy1 = cy + H / 2;
  ctx.beginPath();
  for (let x = gx0; x < gx1; x += gs) { ctx.moveTo(x, cy - H / 2); ctx.lineTo(x, gy1); }
  for (let y = gy0; y < gy1; y += gs) { ctx.moveTo(cx - W / 2, y); ctx.lineTo(gx1, y); }
  ctx.stroke();
  // drifting dust motes

      ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = '#ffd6ff';
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 3.2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(2, 0, 1.6, 0, TAU); ctx.fill();
      ctx.restore();
    }
    // bolts (lightning)
    ctx.globalCompositeOperation = 'lighter';
    for (const b of G.bolts) {
      ctx.strokeStyle = `rgba(198,157,255,${b.life / 0.14})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1);
      const segs = 5;
      for (let i = 1; i <= segs; i++) {
        const t = i / segs;
        const jx = i < segs ? rand(-7, 7) : 0, jy = i < segs ? rand(-7, 7) : 0;
        ctx.lineTo(lerp(b.x1, b.x2, t) + jx, lerp(b.y1, b.y2, t) + jy);
      }
      ctx.stroke();
    }
    // nova rings
    for (const r of G.rings) {
      const a = 1 - r.t / r.dur;
      ctx.strokeStyle = r.col; ctx.globalAlpha = a * 0.9; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
      ctx.globalAlpha = a * 0.3; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // bullets
    ctx.globalCompositeOperation = 'lighter';
    for (const b of G.bullets) {
      const big = !!b.big;
      drawGlow(b.x, b.y, big ? 20 : 11, b.col, 0.55);
      ctx.strokeStyle = b.col; ctx.lineWidth = big ? 5 : 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * (big ? 0.045 : 0.026), b.y - b.vy * (big ? 0.045 : 0.026)); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = '#eaffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, big ? 3 : 1.8, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    // player trail
    for (const tr of G.trail) {
      ctx.globalAlpha = tr.a * 0.35;
      drawShip(tr.x, tr.y, tr.aim, true);
      ctx.globalAlpha = 1;
    }
    // player
    if (G.state === 'playing') {
      const blink = p.iframes > 0 && Math.sin(G.time * 40) > 0;
      drawGlow(p.x, p.y, 34, '#29e6ff', 0.5);
      ctx.globalAlpha = blink ? 0.35 : 1;
      drawShip(p.x, p.y, p.aim, false);
      ctx.globalAlpha = 1;
    }
    // particles
    ctx.globalCompositeOperation = 'lighter';
    for (const pt of G.particles) {
      const a = pt.life / pt.max;
      ctx.globalAlpha = a;
      if (pt.shape === 'shard') {
        ctx.save();
        ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot || 0);
        ctx.fillStyle = pt.col;
        const s2 = pt.size * (0.5 + a * 0.8);
        ctx.beginPath();
        ctx.moveTo(s2, 0); ctx.lineTo(-s2 * 0.6, s2 * 0.7); ctx.lineTo(-s2 * 0.6, -s2 * 0.7);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (pt.shape === 'spark') {
        ctx.strokeStyle = pt.col; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y); ctx.lineTo(pt.x - pt.vx * 0.035, pt.y - pt.vy * 0.035);
        ctx.stroke();
      } else {
        ctx.fillStyle = pt.col;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * a + 0.5, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // damage texts
    ctx.textAlign = 'center';
    for (const t of G.texts) {
      ctx.globalAlpha = Math.min(1, t.life / t.max * 1.6);
      ctx.font = 'bold ' + t.size + 'px Consolas,monospace';
      ctx.fillStyle = t.col;
      ctx.fillText(t.str, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  } else {
    // title decoration: slow rotating emblem rings
    ctx.save();
    ctx.rotate(G.time * 0.1);
    ctx.strokeStyle = 'rgba(125,249,255,0.09)'; ctx.lineWidth = 2;
    poly(0, 0, 185, 6, 0); ctx.stroke();
    ctx.rotate(-G.time * 0.26);
    ctx.strokeStyle = 'rgba(255,92,138,0.08)';
    ctx.setLineDash([30, 20]);
    ctx.beginPath(); ctx.arc(0, 0, 122, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  ctx.restore();
  // touch joystick
  if (Input.touch) {
    ctx.strokeStyle = 'rgba(125,249,255,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(Input.touch.ox, Input.touch.oy, 46, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(125,249,255,0.5)';
    const dx = Input.touch.x - Input.touch.ox, dy = Input.touch.y - Input.touch.oy;
    const m = Math.min(Math.hypot(dx, dy), 46);
    const a = Math.atan2(dy, dx);
    ctx.beginPath(); ctx.arc(Input.touch.ox + Math.cos(a) * m, Input.touch.oy + Math.sin(a) * m, 16, 0, TAU); ctx.fill();
  }
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,10,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}
function drawShip(x, y, aim, ghost) {
  if (ghost) {
    drawSprite(SPRITES.ship, x, y, aim, 1, false);
    return;
  }
  const moving = G.p.mvx || G.p.mvy || G.p.dashT > 0;
  if (moving) {
    const len = G.p.dashT > 0 ? 26 : 8 + rand(0, 7);
    ctx.save();
    ctx.translate(x, y); ctx.rotate(aim);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(125,249,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(-12, 3.2); ctx.lineTo(-12 - len, 0); ctx.lineTo(-12, -3.2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  drawSprite(SPRITES.ship, x, y, aim, 1, false);
}
function drawEnemy(e) {
  const s = 0.3 + 0.7 * e.born;
  const r = e.r * s;
  ctx.save();
  ctx.translate(e.x, e.y);
  const lod = G.enemies.length > 240;
  if (!lod || e.boss || e.elite) drawGlow(0, 0, r * 2.3, e.col, e.boss ? 0.5 : 0.3);
  if (e.born < 1 && (e.r >= 13 || e.elite)) {
    ctx.globalAlpha = (1 - e.born) * 0.8;
    ctx.strokeStyle = e.col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, e.r * (2.6 - e.born * 1.5), 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  const spr = SPRITES[e.type];
  const flash = e.flash > 0 || (e.state === 'tel' && Math.sin(G.time * 26) > 0);
  if (spr) drawSprite(spr, 0, 0, e.rot || 0, s * (e.elite ? 1.42 : 1), flash);
  if (!flash && e.type === 'spitter') {
    const ch = clamp(1 - e.shootCd / 2.6, 0, 1);
    ctx.fillStyle = '#eaffff';
    ctx.beginPath();
    ctx.arc(Math.cos(e.rot || 0) * 4.5 * s, Math.sin(e.rot || 0) * 4.5 * s, (1.8 + ch * 2.8) * s, 0, TAU);
    ctx.fill();
  }
  if (e.type === 'warden') drawGlow(0, 0, 15, '#ffd7e2', 0.4 + Math.sin(G.time * 5) * 0.15);
  if (e.type === 'devourer') {
    if (e.state === 'tel') {
      ctx.strokeStyle = `rgba(255,184,77,${0.35 + Math.sin(G.time * 24) * 0.25})`;
      ctx.lineWidth = 3; ctx.setLineDash([12, 9]);
      ctx.beginPath(); ctx.moveTo(e.cdx * 42, e.cdy * 42); ctx.lineTo(e.cdx * 470, e.cdy * 470); ctx.stroke();
      ctx.setLineDash([]);
    }
    drawGlow(0, 0, 14, e.state === 'charge' ? '#ffb84d' : '#b366ff', 0.5);
  }
  if (e.type === 'crown') {
    const pc = e.phase === 2 ? '#ff5c8a' : '#7df9ff';
    drawGlow(0, 0, 22, pc, 0.55);
    ctx.strokeStyle = pc; ctx.lineWidth = 2.5; ctx.setLineDash([14, 9]);
    ctx.beginPath(); ctx.arc(0, 0, e.r * 1.32, G.time * 1.4, G.time * 1.4 + TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = pc;
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
  }
  if (e.elite) {
    ctx.strokeStyle = 'rgba(255,210,77,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = G.time * 1.3 + i * TAU / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (r + 3), Math.sin(a) * (r + 3));
      ctx.lineTo(Math.cos(a) * (r + 9), Math.sin(a) * (r + 9));
      ctx.stroke();
    }
  }
  if (!e.boss && e.hp < e.maxhp && (e.elite || e.maxhp >= 60)) {
    const w2 = Math.max(26, e.r * 2);
    ctx.fillStyle = 'rgba(8,12,24,0.75)';
    ctx.fillRect(-w2 / 2, -e.r - 13, w2, 3.5);
    ctx.fillStyle = '#ff5c7a';
    ctx.fillRect(-w2 / 2, -e.r - 13, w2 * clamp(e.hp / e.maxhp, 0, 1), 3.5);
  }
  ctx.restore();
}

/* ============================================================ main loop */
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - lastT) / 1000;
  lastT = now;
  if (rdt > 0.1) rdt = 0.1;
  // fps meter
  G.fpsAcc += rdt; G.fpsN++; G.fpsT += rdt;
  if (G.fpsT > 2) {
    G.fps = G.fpsN / G.fpsAcc;
    if (DBG.debug) console.log(`[NV] t=${fmtTime(G.time)} fps=${G.fps.toFixed(0)} enemies=${G.enemies.length} bullets=${G.bullets.length + G.ebullets.length} parts=${G.particles.length}`);
    G.fpsAcc = 0; G.fpsN = 0; G.fpsT = 0;
  }
  // substep for stability at high timescale (fast multiplies BEFORE splitting)
  const total = rdt * DBG.fast;
  const steps = clamp(Math.ceil(total / 0.033), 1, 12);
  for (let i = 0; i < steps; i++) update(total / steps);
  render();
}
window.__NV = { get G() { return G; }, DBG, startRun, showTitle, showLevelUp, chooseCard, showShop, evoAvailable, AU,
  // manual pump for automated testing (hidden tabs suspend rAF)
  pump(dt) {
    try {
      const total = dt * DBG.fast;
      const steps = clamp(Math.ceil(total / 0.033), 1, 12);
      for (let i = 0; i < steps; i++) update(total / steps);
      if (DBG.bot && G.state === 'levelup' && G.cards.length) {
        const w = { evo: -1, weapon: 0, passive: 1, heal: 2 };
        const aoe = { nova: 0, orbit: 0, chain: 0, aura: 0.1 };
        // chase the evolution pairing once a weapon is maxed
        let boostId = null;
        for (const wp of G.p.weapons) {
          if (wp.lvl >= 5 && !wp.evo && WEAPONS[wp.id].evo) {
            const pid = WEAPONS[wp.id].evo.passive;
            if ((G.p.passives[pid] || 0) < PASSIVES[pid].max) { boostId = pid; break; }
          }
        }
        const best = G.cards.map((c, i) => ({ i, o: w[c.kind] + (c.kind === 'passive' && c.id === boostId ? -0.8 : 0) + (c.kind === 'weapon' && aoe[c.id] !== undefined ? aoe[c.id] : 0.22) + rand(0.4) })).sort((a, b) => a.o - b.o)[0];
        chooseCard(best.i);
      }
      render();
      return { state: G.state, time: +G.time.toFixed(1) };
    } catch (e) { return 'ERR: ' + e.message + '\n' + (e.stack || '').split('\n')[1]; }
  },
  // profiling: separate render vs update cost
  prof(n = 100) {
    const t0 = performance.now();
    for (let i = 0; i < n; i++) render();
    const rms = (performance.now() - t0) / n;
    const t1 = performance.now();
    for (let i = 0; i < n; i++) update(0.016);
    const ums = (performance.now() - t1) / n;
    return { renderMs: +rms.toFixed(2), updateMs: +ums.toFixed(2), enemies: G.enemies.length, particles: G.particles.length, ebullets: G.ebullets.length };
  },
  // synthetic input (test only)
  key(code, down = true) {
    dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true }));
  },
};
G = { state: 'boot' };
showTitle();
requestAnimationFrame(frame);
})();
</script>
